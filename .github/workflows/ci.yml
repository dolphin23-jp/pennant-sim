name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Format migrated sources
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/typescript-engine-parity'
        run: |
          npm run format
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Format TypeScript engine modules"
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Compare engine baseline
        run: npm run baseline:compare
