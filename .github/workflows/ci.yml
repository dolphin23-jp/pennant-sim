name: Apply stolen-base typing fix

on:
  push:
    branches:
      - agent/phase3-name-generation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-name-generation
          fetch-depth: 0
      - name: Add legacy-safe speed fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/engine/game.ts')
          text = path.read_text()
          text = text.replace(
              "let attemptRate = clamp(((runnerPlayer.p.sp - 30) / 260) * 0.55, 0.01, 0.13);",
              "let attemptRate = clamp((((runnerPlayer.p.sp ?? 50) - 30) / 260) * 0.55, 0.01, 0.13);",
          )
          text = text.replace(
              "(0.62 + (runnerPlayer.p.sp - 50) / 280 - defensePenalty) *",
              "(0.62 + ((runnerPlayer.p.sp ?? 50) - 50) / 280 - defensePenalty) *",
          )
          path.write_text(text)
          PY
      - name: Commit typing fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine/game.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: support missing runner speed in legacy saves"
          git push origin HEAD:agent/phase3-name-generation
