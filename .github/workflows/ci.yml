name: Phase 3 lint patch

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase3-name-generation
      - name: Patch and restore CI
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/engine/players.ts')
          text = path.read_text()
          old = 'export function registerExistingNames(_teams: Partial<Teams>): void {}'
          new = '''export function registerExistingNames(teams: Partial<Teams>): void {
            void teams;
          }'''
          if old not in text:
              raise SystemExit('name registry function not found')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/ci.yml').write_text('''name: CI

          on:
            push:
            pull_request:

          permissions:
            contents: read

          jobs:
            quality:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v4
                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - name: Install dependencies
                  run: npm install
                - name: Lint
                  run: npm run lint
                - name: Test
                  run: npm test
                - name: Build
                  run: npm run build
          ''')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/players.ts .github/workflows/ci.yml
          git commit -m "fix: keep compatibility name registry lint-clean"
          git push origin HEAD:agent/phase3-name-generation
