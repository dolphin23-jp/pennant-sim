name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Test
        id: tests
        continue-on-error: true
        run: npm test > test-output.txt 2>&1
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-test-diagnostics
          path: test-output.txt
      - name: Fail when tests fail
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Build
        run: npm run build
