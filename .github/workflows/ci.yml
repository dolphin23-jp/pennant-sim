name: Apply phase 3 compatibility fix

on:
  push:
    branches:
      - agent/phase3-name-generation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-name-generation
          fetch-depth: 0
      - name: Preserve name retry randomness without display suffixes
        run: |
          python - <<'PY'
          from pathlib import Path

          players = Path('src/engine/players.ts')
          text = players.read_text()
          old = """const japaneseName = (): string => `${randomChoice(SN)} ${randomChoice(GN)}`;
          const foreignName = (): string => `${randomChoice(FOREIGN_SN)} ${randomChoice(FOREIGN_GN)}`;
          const generatedName = (baseName: () => string): string => baseName();

          // Display names are not identifiers. Same-name players remain distinct through Player.id.
          export function registerExistingNames(teams: Partial<Teams>): void {
            void teams;
          }
          """
          new = """const usedNames = new Set<string>();
          const japaneseName = (): string => `${randomChoice(SN)} ${randomChoice(GN)}`;
          const foreignName = (): string => `${randomChoice(FOREIGN_SN)} ${randomChoice(FOREIGN_GN)}`;
          function generatedName(baseName: () => string): string {
            for (let attempt = 0; attempt < 48; attempt += 1) {
              const candidate = baseName();
              if (!usedNames.has(candidate)) {
                usedNames.add(candidate);
                return candidate;
              }
            }
            // Same-name players are valid and remain distinct through Player.id.
            const duplicate = baseName();
            usedNames.add(duplicate);
            return duplicate;
          }

          export function registerExistingNames(teams: Partial<Teams>): void {
            usedNames.clear();
            for (const team of Object.values(teams)) {
              for (const player of [...(team?.fielders ?? []), ...(team?.pitchers ?? [])])
                if (player.name) usedNames.add(player.name);
            }
          }
          """
          if old not in text:
              raise SystemExit('players.ts target snippet not found')
          players.write_text(text.replace(old, new))

          test_file = Path('tests/name-generation.test.ts')
          test_text = test_file.read_text()
          test_text = test_text.replace(
              "    assert.ok(new Set(players.map((player) => player.name)).size < players.length);\n",
              "",
          )
          test_file.write_text(test_text)
          PY
      - name: Commit compatibility fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine/players.ts tests/name-generation.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve name-generation random sequence"
          git push origin HEAD:agent/phase3-name-generation
