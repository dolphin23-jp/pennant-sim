name: Sync generated balance baseline

on:
  push:
    branches:
      - agent/phase3-name-generation

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-name-generation
          fetch-depth: 0
      - name: Synchronize checked-in generated baseline
        run: cp baseline/season-stats.json baseline/new-season-stats.json
      - name: Commit synchronized baseline
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add baseline/new-season-stats.json
          git diff --cached --quiet && exit 0
          git commit -m "test: sync generated balance baseline"
          git push origin HEAD:agent/phase3-name-generation
