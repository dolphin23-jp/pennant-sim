name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Generate current baseline
        run: npm run baseline:new
      - name: Upload current baseline
        uses: actions/upload-artifact@v4
        with:
          name: current-balance-baseline
          path: baseline/new-season-stats.json
      - name: Compare recorded baseline
        run: node scripts/compare-baselines.mjs
      - name: Build
        run: npm run build
