name: Apply stolen-base calibration

on:
  push:
    branches:
      - agent/phase3-name-generation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-name-generation
          fetch-depth: 0
      - name: Calibrate stolen-base attempt rate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/engine/game.ts')
          text = path.read_text()
          old = "let attemptRate = clamp((runnerPlayer.p.sp - 30) / 260, 0.02, 0.22);"
          new = "let attemptRate = clamp(((runnerPlayer.p.sp - 30) / 260) * 0.55, 0.01, 0.13);"
          if old not in text:
              raise SystemExit('stolen-base attempt-rate target not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit calibration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/engine/game.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: calibrate stolen-base attempt frequency"
          git push origin HEAD:agent/phase3-name-generation
