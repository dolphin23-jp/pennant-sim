name: Phase 7 test diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/phase7-ai-roster-strategy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply implementation and capture tests
        shell: bash
        run: |
          python scripts/phase7-implement.py
          python scripts/phase7-fix-lint.py
          python scripts/phase7-fix-test.py
          set +e
          npm test > phase7-test.log 2>&1
          echo "$?" > phase7-test-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase7-test-diagnostics
          path: |
            phase7-test.log
            phase7-test-exit.txt
