name: Scoring Tune Artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Regenerate initial baseline
        run: npm run baseline
      - name: Regenerate franchise drift baseline
        run: npm run drift
      - name: Commit baseline reports
        shell: bash
        run: |
          if git diff --quiet -- baseline/season-stats.json baseline/franchise-drift.json; then
            echo "Baseline reports are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/season-stats.json baseline/franchise-drift.json
          git commit -m "Regenerate NPB scoring baselines"
          git push
      - name: Upload baseline reports
        uses: actions/upload-artifact@v4
        with:
          name: npb-scoring-baselines
          path: |
            baseline/season-stats.json
            baseline/franchise-drift.json
          if-no-files-found: error
