name: Franchise Drift Artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run 25-season franchise drift
        run: npm run drift
      - name: Commit drift report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/franchise-drift.json
          if git diff --cached --quiet; then
            echo "Drift report is already current."
            exit 0
          fi
          git commit -m "Record franchise drift baseline"
          git push
      - name: Upload drift report
        uses: actions/upload-artifact@v4
        with:
          name: franchise-drift-report
          path: baseline/franchise-drift.json
          if-no-files-found: error
