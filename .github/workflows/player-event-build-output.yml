name: Player Event Build Output

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture unit test output
        shell: bash
        run: |
          set +e
          npm run test:unit 2>&1 | tee unit-output.txt
          echo ${PIPESTATUS[0]} > unit-exit-code.txt
          exit 0
      - name: Capture build output
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build-output.txt
          echo ${PIPESTATUS[0]} > build-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: player-event-build-output
          path: |
            unit-output.txt
            unit-exit-code.txt
            build-output.txt
            build-exit-code.txt
