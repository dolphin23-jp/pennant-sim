name: Phase 4 implementation

on:
  push:
    branches:
      - agent/phase4-career-ledger

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase4-career-ledger
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Implement career ledger
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          types = Path('src/engine/types.ts')
          text = types.read_text()
          anchor = "export type PlayerStats = BatterStats | PitcherStats;\nexport type AccumulatedStats = Record<string, PlayerStats>;"
          replacement = """export type PlayerStats = BatterStats | PitcherStats;
export type AccumulatedStats = Record<string, PlayerStats>;
export interface PlayerSeasonRecord {
  playerId: string;
  playerName: string;
  year: number;
  age: number;
  teamKey: TeamKey;
  teamName: string;
  teamAbbreviation: string;
  isPitcher: boolean;
  role?: PitcherRole;
  position?: FieldPosition;
  ovr: number;
  params: PlayerParams;
  stats: PlayerStats;
}
export type YearlyPlayerRecords = Record<string, PlayerSeasonRecord[]>;"""
          if anchor not in text:
              raise SystemExit('types anchor not found')
          types.write_text(text.replace(anchor, replacement))

          Path('src/engine/careerLedger.ts').write_text("""import { calcOvr } from './ratings';
import type {
  AccumulatedStats,
  BatterStats,
  PitcherStats,
  Player,
  PlayerSeasonRecord,
  PlayerStats,
  Team,
  TeamKey,
  Teams,
} from './types';

const emptyBatterStats = (player: Player): BatterStats => ({
  type: 'bat',
  name: player.name,
  g: 0,
  pa: 0,
  ab: 0,
  h: 0,
  s: 0,
  d: 0,
  t: 0,
  hr: 0,
  bb: 0,
  k: 0,
  rbi: 0,
  sb: 0,
  cs: 0,
  bnt: 0,
  sf: 0,
});

const emptyPitcherStats = (player: Player): PitcherStats => ({
  type: 'pit',
  name: player.name,
  g: 0,
  gs: 0,
  w: 0,
  l: 0,
  sv: 0,
  hld: 0,
  bs: 0,
  ip3: 0,
  h: 0,
  bb: 0,
  k: 0,
  er: 0,
  pc: 0,
});

function snapshotStats(player: Player, stats: AccumulatedStats): PlayerStats {
  const recorded = stats[player.id];
  if (recorded) return { ...recorded } as PlayerStats;
  return player.isP ? emptyPitcherStats(player) : emptyBatterStats(player);
}

function snapshotPlayer(
  year: number,
  teamKey: TeamKey,
  team: Team,
  player: Player,
  stats: AccumulatedStats,
): PlayerSeasonRecord {
  return {
    playerId: player.id,
    playerName: player.name,
    year,
    age: player.age,
    teamKey,
    teamName: team.n,
    teamAbbreviation: team.ab,
    isPitcher: player.isP,
    role: player.role,
    position: player._assignedPos ?? player.pos,
    ovr: calcOvr(player),
    params: structuredClone(player.p),
    stats: snapshotStats(player, stats),
  };
}

export function createPlayerSeasonRecords(
  year: number,
  teams: Teams,
  stats: AccumulatedStats,
): PlayerSeasonRecord[] {
  return (Object.entries(teams) as Array<[TeamKey, Team]>).flatMap(([teamKey, team]) => [
    ...team.pitchers.map((player) => snapshotPlayer(year, teamKey, team, player, stats)),
    ...team.fielders.map((player) => snapshotPlayer(year, teamKey, team, player, stats)),
  ]);
}
""")

          index = Path('src/engine/index.ts')
          text = index.read_text()
          if "export * from './careerLedger';" not in text:
              text = text.replace("export * from './atBat';\n", "export * from './atBat';\nexport * from './careerLedger';\n")
          index.write_text(text)

          storage = Path('src/state/storage.ts')
          text = storage.read_text()
          text = text.replace("  Teams,\n} from '../engine';", "  Teams,\n  YearlyPlayerRecords,\n} from '../engine';")
          text = text.replace("  yearlyStats: Record<string, unknown[]>;", "  yearlyStats: YearlyPlayerRecords;")
          anchor = "function migrateNotices(value: unknown): Notice[] {"
          helper = """function migrateYearlyStats(value: unknown): YearlyPlayerRecords {
  if (!value || typeof value !== 'object' || Array.isArray(value)) return {};
  const output: YearlyPlayerRecords = {};
  for (const [year, entries] of Object.entries(value)) {
    if (!Array.isArray(entries)) continue;
    output[year] = entries.flatMap((entry) => {
      if (!entry || typeof entry !== 'object') return [];
      const record = entry as Record<string, unknown>;
      if (
        typeof record.playerId !== 'string' ||
        typeof record.playerName !== 'string' ||
        typeof record.year !== 'number' ||
        typeof record.age !== 'number' ||
        typeof record.teamKey !== 'string' ||
        !teamKeys.includes(record.teamKey as TeamKey) ||
        typeof record.teamName !== 'string' ||
        typeof record.teamAbbreviation !== 'string' ||
        typeof record.isPitcher !== 'boolean' ||
        typeof record.ovr !== 'number' ||
        !record.params || typeof record.params !== 'object' ||
        !record.stats || typeof record.stats !== 'object'
      ) return [];
      return [record as unknown as YearlyPlayerRecords[string][number]];
    });
  }
  return output;
}

"""
          if anchor not in text:
              raise SystemExit('storage helper anchor not found')
          text = text.replace(anchor, helper + anchor)
          text = text.replace("    yearlyStats: legacy.yearlyStats ?? {},", "    yearlyStats: migrateYearlyStats(legacy.yearlyStats),")
          storage.write_text(text)

          state = Path('src/state/gameState.tsx')
          text = state.read_text()
          text = text.replace("  calcStandings,\n", "  calcStandings,\n  createPlayerSeasonRecords,\n")
          text = text.replace("  Teams,\n} from '../engine';", "  Teams,\n  YearlyPlayerRecords,\n} from '../engine';")
          text = text.replace("  yearlyStats: Record<string, unknown[]>;", "  yearlyStats: YearlyPlayerRecords;")
          old = """      const year = current.season.year + 1;
      const schedule = generateSchedule(year);"""
          new = """      const completedYear = current.season.year;
      const seasonRecords = current.teams
        ? createPlayerSeasonRecords(completedYear, current.teams, current.leagueAccumulated)
        : [];
      const year = completedYear + 1;
      const schedule = generateSchedule(year);"""
          if old not in text:
              raise SystemExit('completeOffseason year anchor not found')
          text = text.replace(old, new)
          old = """        leagueAccumulated: prepared.leagueDistStats,
        notices: mergeNotices(current.notices, developmentNotices),"""
          new = """        leagueAccumulated: prepared.leagueDistStats,
        yearlyStats: {
          ...current.yearlyStats,
          [String(completedYear)]: seasonRecords,
        },
        notices: mergeNotices(current.notices, developmentNotices),"""
          if old not in text:
              raise SystemExit('completeOffseason state anchor not found')
          text = text.replace(old, new)
          state.write_text(text)

          Path('tests/careerLedger.test.ts').write_text("""import assert from 'node:assert/strict';
import test from 'node:test';

import { createPlayerSeasonRecords, initTeams } from '../src/engine/index.ts';
import type { BatterStats } from '../src/engine/index.ts';
import { migrateSaveData } from '../src/state/storage.ts';

const batterLine = (name: string): BatterStats => ({
  type: 'bat',
  name,
  g: 143,
  pa: 600,
  ab: 540,
  h: 162,
  s: 120,
  d: 30,
  t: 2,
  hr: 10,
  bb: 52,
  k: 80,
  rbi: 70,
  sb: 12,
  cs: 4,
  bnt: 3,
  sf: 5,
});

test('年度台帳は所属・年齢・能力・成績を独立したスナップショットとして保存する', () => {
  const teams = initTeams();
  const player = teams.giants.fielders[0];
  const originalContact = player.p.cf;
  const records = createPlayerSeasonRecords(2026, teams, {
    [player.id]: batterLine(player.name),
  });
  const record = records.find((entry) => entry.playerId === player.id);

  assert.ok(record);
  assert.equal(record.year, 2026);
  assert.equal(record.age, player.age);
  assert.equal(record.teamKey, 'giants');
  assert.equal(record.teamName, teams.giants.n);
  assert.equal(record.stats.type, 'bat');
  assert.equal(record.stats.hr, 10);
  assert.equal(record.params.cf, originalContact);

  player.age += 1;
  player.p.cf = Number(player.p.cf ?? 0) + 10;
  teams.giants.n = '変更後球団名';

  assert.notEqual(record.age, player.age);
  assert.equal(record.params.cf, originalContact);
  assert.notEqual(record.teamName, teams.giants.n);
});

test('出場のない選手もゼロ成績で年度台帳へ残る', () => {
  const teams = initTeams();
  const player = teams.tigers.pitchers[0];
  const record = createPlayerSeasonRecords(2026, teams, {}).find(
    (entry) => entry.playerId === player.id,
  );

  assert.ok(record);
  assert.equal(record.stats.type, 'pit');
  assert.equal(record.stats.g, 0);
  assert.equal(record.stats.ip3, 0);
});

test('旧セーブの不定形yearlyStatsは安全に除外し、正式台帳は保持する', () => {
  const teams = initTeams();
  const player = teams.carp.fielders[0];
  const [record] = createPlayerSeasonRecords(2026, teams, {
    [player.id]: batterLine(player.name),
  }).filter((entry) => entry.playerId === player.id);

  const migrated = migrateSaveData({
    teams,
    playerTeam: 'carp',
    season: { year: 2027, schedule: [] },
    yearlyStats: {
      '2025': [{ legacy: true }],
      '2026': [record],
    },
  });

  assert.ok(migrated);
  assert.deepEqual(migrated.yearlyStats['2025'], []);
  assert.equal(migrated.yearlyStats['2026'][0]?.playerId, player.id);
});
""")
          PY
