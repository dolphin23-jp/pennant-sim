name: Phase 4 diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/phase4-career-ledger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture test output
        shell: bash
        run: |
          set +e
          npm test > phase4-test.log 2>&1
          code=$?
          tail -n 180 phase4-test.log > phase4-test-tail.log
          echo "$code" > phase4-test-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase4-test-diagnostics
          path: |
            phase4-test-tail.log
            phase4-test-exit.txt
