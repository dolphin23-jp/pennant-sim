name: Phase 6 build diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/phase6-fictional-history-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture build output
        shell: bash
        run: |
          set +e
          npm run build > phase6-build.log 2>&1
          echo "$?" > phase6-build-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase6-build-diagnostics
          path: |
            phase6-build.log
            phase6-build-exit.txt
