name: Apply Player Event Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - run: python scripts/apply-player-event-tests.py
      - name: Commit tests
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Tests already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "Test growth, awakenings, and injuries"
          git push
