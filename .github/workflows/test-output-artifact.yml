name: Test Output Artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-output:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture test output
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          echo "$status" > test-exit-code.txt
          exit 0
      - name: Upload test output
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            test-output.txt
            test-exit-code.txt
