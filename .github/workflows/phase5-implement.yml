name: Phase 5 implement

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'agent/phase5-historical-rankings-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase5-historical-rankings-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/phase5-implement.py
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit implementation
        run: |
          rm -f scripts/phase5-implement.py scripts/phase5-trigger.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add historical rankings"
          git push origin HEAD:agent/phase5-historical-rankings-v2
