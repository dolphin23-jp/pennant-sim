name: Phase 5 inspect

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/phase5-historical-rankings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/phase5-inspect.py
      - uses: actions/upload-artifact@v4
        with:
          name: phase5-inspect
          path: phase5-inspect.txt
