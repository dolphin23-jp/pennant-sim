name: Temporary phase 5 test diagnostics

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/balance-phase5' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture full test output
        run: |
          set +e
          npm test > baseline/phase5-final-test.log 2>&1
          status=$?
          set -e
          echo "$status" > baseline/phase5-final-test.status
          cat baseline/phase5-final-test.log
      - name: Commit diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f baseline/phase5-final-test.log baseline/phase5-final-test.status
          git commit -m "Capture phase 5 test diagnostics"
          git push origin HEAD:${{ github.head_ref }}
