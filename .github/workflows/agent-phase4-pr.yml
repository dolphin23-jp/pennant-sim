name: Temporary phase 4 balance validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'agent/balance-phase4' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format
        run: npx prettier --write src/data/constants.ts
      - name: Build
        run: npm run build > baseline/phase4-build.log 2>&1
      - name: Unit tests
        run: npm run test:unit > baseline/phase4-unit.log 2>&1
      - name: Generate 100-season candidate baseline
        continue-on-error: true
        run: npm run baseline:new > baseline/phase4-baseline.log 2>&1
      - name: Commit candidate and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/constants.ts
          git add -f baseline/new-season-stats.json baseline/phase4-*.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Validate phase 4 at-bat balance"
          git push origin HEAD:${{ github.head_ref }}
