name: Phase 7 lint diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/phase7-ai-roster-strategy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply implementation and capture lint
        shell: bash
        run: |
          python scripts/phase7-implement.py
          set +e
          npm run lint > phase7-lint.log 2>&1
          echo "$?" > phase7-lint-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase7-lint-diagnostics
          path: |
            phase7-lint.log
            phase7-lint-exit.txt
