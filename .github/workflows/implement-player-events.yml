name: Implement Player Events

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply implementation patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              target.write_text(text.replace(old, new, 1))

          constants = Path('src/data/constants.ts')
          text = constants.read_text()
          marker = "export const MATURITY_WEIGHTS = [0.08, 0.18, 0.44, 0.18, 0.12];\n"
          addition = marker + """

          export const PLAYER_DEVELOPMENT_BALANCE = {
            annualRandomVariation: {
              maxAbsoluteChange: 0.35,
              fallbackStep: 1,
              minimumRating: 1,
              maximumRating: 99,
            },
            awakening: {
              inSeasonBaseRate: 0.0002,
              offseasonBaseRate: 0.012,
            },
            injury: {
              participantGameRate: 0.00075,
              severityWeights: { light: 0.74, mid: 0.23, heavy: 0.03 },
              recoveryDays: {
                light: { minimum: 2, maximum: 5 },
                mid: { minimum: 8, maximum: 18 },
                heavy: { minimum: 35, maximum: 70 },
              },
              heavyPermanentLoss: {
                parameterMinimum: 1,
                parameterMaximum: 2,
                amountMinimum: 1,
                amountMaximum: 2,
              },
            },
          } as const;
          """
          if 'PLAYER_DEVELOPMENT_BALANCE' not in text:
              constants.write_text(text.replace(marker, addition, 1))

          replace_once(
              'src/engine/growth.ts',
              "import { BS, GROW_P, PS } from '../data';",
              "import { BS, GROW_P, PLAYER_DEVELOPMENT_BALANCE, PS } from '../data';",
          )
          replace_once(
              'src/engine/growth.ts',
              """    const trainingBonus = trainingBonusByPolicy[player.trainPolicy]?.[parameter] ?? 0,
              growth =
                gap *
                definition.c *
                Math.max(-0.18, adjustedAgeEffect) *
                (0.55 + random() * 0.9) *
                (1 + trainingBonus),
              nextValue = Math.round(before + growth);
            (params as unknown as Record<string, unknown>)[parameter] =
              growth > 0 ? Math.min(nextValue, ceiling) : nextValue;
          """,
              """    const trainingBonus = trainingBonusByPolicy[player.trainPolicy]?.[parameter] ?? 0,
              developmentGrowth =
                gap *
                definition.c *
                Math.max(-0.18, adjustedAgeEffect) *
                (0.55 + random() * 0.9) *
                (1 + trainingBonus),
              randomVariation =
                (random() * 2 - 1) *
                PLAYER_DEVELOPMENT_BALANCE.annualRandomVariation.maxAbsoluteChange,
              developedValue =
                developmentGrowth > 0
                  ? Math.min(before + developmentGrowth, ceiling)
                  : before + developmentGrowth,
              nextValue = Math.round(developedValue + randomVariation);
            (params as unknown as Record<string, unknown>)[parameter] = clamp(
              nextValue,
              PLAYER_DEVELOPMENT_BALANCE.annualRandomVariation.minimumRating,
              PLAYER_DEVELOPMENT_BALANCE.annualRandomVariation.maximumRating,
            );
          """,
          )
          replace_once(
              'src/engine/growth.ts',
              """  const overallBefore = calcOVR(player, player.pos),
          """,
              """  if (!changes.length) {
            const fallbackParameter = randomChoice(
              parameterNames.filter((parameter) => Boolean(GROW_P[parameter])),
            );
            const before = Number(params[fallbackParameter] ?? 50),
              preferredDirection = random() < 0.5 ? -1 : 1,
              step = PLAYER_DEVELOPMENT_BALANCE.annualRandomVariation.fallbackStep,
              minimum = PLAYER_DEVELOPMENT_BALANCE.annualRandomVariation.minimumRating,
              maximum = PLAYER_DEVELOPMENT_BALANCE.annualRandomVariation.maximumRating;
            let after = clamp(before + preferredDirection * step, minimum, maximum);
            if (after === before) after = clamp(before - preferredDirection * step, minimum, maximum);
            (params as unknown as Record<string, unknown>)[fallbackParameter] = after;
            changes.push({
              param: fallbackParameter,
              before,
              after,
              diff: after - before,
            });
          }
            const overallBefore = calcOVR(player, player.pos),
          """,
          )
          replace_once(
              'src/engine/growth.ts',
              """      (inSeason ? 0.0022 : 0.012) *
          """,
              """      (inSeason
                ? PLAYER_DEVELOPMENT_BALANCE.awakening.inSeasonBaseRate
                : PLAYER_DEVELOPMENT_BALANCE.awakening.offseasonBaseRate) *
          """,
          )
          replace_once(
              'src/engine/growth.ts',
              """export function applyInSeasonAwakening(team: Teams[keyof Teams]): {
          """,
              """export function applyInSeasonAwakening(
            team: Teams[keyof Teams],
            eligiblePlayerIds?: ReadonlySet<string>,
          ): {
          """,
          )
          replace_once(
              'src/engine/growth.ts',
              """      pitchers: team.pitchers.map((pitcher) => {
                const awakening = checkAwakening(pitcher, true);
          """,
              """      pitchers: team.pitchers.map((pitcher) => {
                if (
                  (eligiblePlayerIds && !eligiblePlayerIds.has(pitcher.id)) ||
                  (pitcher.injuryDays ?? 0) > 0
                )
                  return pitcher;
                const awakening = checkAwakening(pitcher, true);
          """,
          )
          replace_once(
              'src/engine/growth.ts',
              """      fielders: team.fielders.map((fielder) => {
                const awakening = checkAwakening(fielder, true);
          """,
              """      fielders: team.fielders.map((fielder) => {
                if (
                  (eligiblePlayerIds && !eligiblePlayerIds.has(fielder.id)) ||
                  (fielder.injuryDays ?? 0) > 0
                )
                  return fielder;
                const awakening = checkAwakening(fielder, true);
          """,
          )

          Path('src/engine/playerEvents.ts').write_text("""import { PLAYER_DEVELOPMENT_BALANCE } from '../data';
          import { applyInSeasonAwakening } from './growth';
          import { clamp, random, randomChoice, randomInt } from './random';
          import type {
            GrowthChange,
            InjuryEvent,
            Player,
            PlayerParams,
            PostGameEvents,
            Team,
            TeamKey,
          } from './types';

          function developmentParameters(player: Player): Array<keyof PlayerParams> {
            return player.isP
              ? ['vel', 'ctrl', 'stam', 'nobi', 'fld']
              : [
                  'cf',
                  'cb',
                  'pw',
                  'dc',
                  'sp',
                  'df',
                  'arm',
                  'stam',
                  ...(player.pos === '捕手' ? (['ld'] as Array<keyof PlayerParams>) : []),
                ];
          }

          function recoverPlayer(player: Player): Player {
            const remaining = player.injuryDays ?? 0;
            if (remaining <= 0) return player;
            const nextDays = Math.max(0, remaining - 1);
            return {
              ...player,
              injuryDays: nextDays,
              injurySeverity: nextDays > 0 ? player.injurySeverity : undefined,
            };
          }

          function chooseSeverity(): Player['injurySeverity'] {
            const roll = random(),
              weights = PLAYER_DEVELOPMENT_BALANCE.injury.severityWeights;
            if (roll < weights.light) return 'light';
            if (roll < weights.light + weights.mid) return 'mid';
            return 'heavy';
          }

          function applyHeavyPermanentLoss(player: Player): {
            player: Player;
            changes: GrowthChange[];
          } {
            const balance = PLAYER_DEVELOPMENT_BALANCE.injury.heavyPermanentLoss,
              candidates = developmentParameters(player).filter(
                (parameter) => typeof player.p[parameter] === 'number',
              ),
              params = { ...player.p },
              changes: GrowthChange[] = [],
              count = randomInt(balance.parameterMinimum, balance.parameterMaximum);
            for (let index = 0; index < count && candidates.length; index += 1) {
              const selected = randomChoice(candidates),
                selectedIndex = candidates.indexOf(selected);
              candidates.splice(selectedIndex, 1);
              const before = Number(params[selected] ?? 50),
                loss = randomInt(balance.amountMinimum, balance.amountMaximum),
                after = clamp(before - loss, 1, 99);
              (params as unknown as Record<string, unknown>)[selected] = after;
              changes.push({ param: selected, before, after, diff: after - before });
            }
            return { player: { ...player, p: params }, changes };
          }

          function applyInjury(
            teamKey: TeamKey,
            player: Player,
          ): { player: Player; event: InjuryEvent | null } {
            if (
              (player.injuryDays ?? 0) > 0 ||
              random() >= PLAYER_DEVELOPMENT_BALANCE.injury.participantGameRate
            )
              return { player, event: null };
            const severity = chooseSeverity(),
              range = PLAYER_DEVELOPMENT_BALANCE.injury.recoveryDays[severity],
              days = randomInt(range.minimum, range.maximum),
              heavyResult =
                severity === 'heavy'
                  ? applyHeavyPermanentLoss(player)
                  : { player, changes: [] as GrowthChange[] },
              injuredPlayer: Player = {
                ...heavyResult.player,
                injuryDays: days,
                injurySeverity: severity,
              };
            return {
              player: injuredPlayer,
              event: {
                teamKey,
                playerId: player.id,
                name: player.name,
                isP: player.isP,
                severity,
                days,
                permanentChanges: heavyResult.changes,
              },
            };
          }

          export function applyPostGamePlayerEvents(
            team: Team,
            participantIds: ReadonlySet<string>,
          ): { team: Team; events: PostGameEvents } {
            const recoveredTeam: Team = {
                ...team,
                pitchers: team.pitchers.map((player) =>
                  participantIds.has(player.id) ? player : recoverPlayer(player),
                ),
                fielders: team.fielders.map((player) =>
                  participantIds.has(player.id) ? player : recoverPlayer(player),
                ),
              },
              awakening = applyInSeasonAwakening(recoveredTeam, participantIds),
              injuries: InjuryEvent[] = [];
            const applyToPlayer = (player: Player): Player => {
              if (!participantIds.has(player.id)) return player;
              const result = applyInjury(team.key, player);
              if (result.event) injuries.push(result.event);
              return result.player;
            };
            return {
              team: {
                ...awakening.team,
                pitchers: awakening.team.pitchers.map(applyToPlayer),
                fielders: awakening.team.fielders.map(applyToPlayer),
              },
              events: {
                awakenings: awakening.events.map((event) => ({
                  teamKey: team.key,
                  playerId: event.player.id,
                  name: event.name,
                  isP: event.isP,
                  isBreakthrough: event.isBreakthrough,
                  newSpecial: event.newSpecial?.n ?? null,
                })),
                injuries,
              },
            };
          }
          """)

          replace_once(
              'src/engine/types.ts',
              """export interface GameState {
          """,
              """export interface InjuryEvent {
            teamKey: TeamKey;
            playerId: string;
            name: string;
            isP: boolean;
            severity: NonNullable<Player['injurySeverity']>;
            days: number;
            permanentChanges: GrowthChange[];
          }
          export interface InSeasonAwakeningEvent {
            teamKey: TeamKey;
            playerId: string;
            name: string;
            isP: boolean;
            isBreakthrough: boolean;
            newSpecial: string | null;
          }
          export interface PostGameEvents {
            awakenings: InSeasonAwakeningEvent[];
            injuries: InjuryEvent[];
          }
          export interface GameState {
          """,
          )
          replace_once(
              'src/engine/types.ts',
              """  holdPitcherIds?: string[];
          }
          """,
              """  holdPitcherIds?: string[];
            postGameEvents: PostGameEvents;
          }
          """,
          )

          replace_once(
              'src/engine/index.ts',
              "export * from './market';",
              "export * from './market';\nexport * from './playerEvents';",
          )

          replace_once(
              'src/engine/game.ts',
              "import { clamp, random } from './random';",
              "import { applyPostGamePlayerEvents } from './playerEvents';\nimport { clamp, random } from './random';",
          )
          replace_once(
              'src/engine/game.ts',
              """  Player,
            Side,
          """,
              """  Player,
            Side,
            Team,
          """,
          )
          replace_once(
              'src/engine/game.ts',
              """const teamKeyForSide = (gameState: GameState, side: Side): TeamKey => gameState.teams[side].key;
          """,
              """const teamKeyForSide = (gameState: GameState, side: Side): TeamKey => gameState.teams[side].key;
          function resolveLineup(team: Team, supplied?: Player[] | null): Player[] {
            if (!supplied?.length) return bestLineup(team);
            const roster = new Map(team.fielders.map((player) => [player.id, player]));
            const resolved = supplied
              .map((player) => {
                const current = roster.get(player.id);
                return current ? { ...current, _assignedPos: player._assignedPos ?? current.pos } : null;
              })
              .filter(
                (player): player is Player => Boolean(player && (player.injuryDays ?? 0) <= 0),
              );
            return resolved.length >= 9 ? resolved.slice(0, 9) : bestLineup(team);
          }
          """,
          )
          replace_once(
              'src/engine/game.ts',
              """      (p) => p.role !== '先発' && !gameState.usedR[fieldingSide].has(p.id) && (p.fatigue || 0) < 95,
          """,
              """      (p) =>
                p.role !== '先発' &&
                !gameState.usedR[fieldingSide].has(p.id) &&
                (p.injuryDays ?? 0) <= 0 &&
                (p.fatigue || 0) < 95,
          """,
          )
          replace_once(
              'src/engine/game.ts',
              """    resolvedHomeLineup = homeLineup || bestLineup(homeTeam),
              resolvedAwayLineup = awayLineup || bestLineup(awayTeam),
          """,
              """    resolvedHomeLineup = resolveLineup(homeTeam, homeLineup),
              resolvedAwayLineup = resolveLineup(awayTeam, awayLineup),
          """,
          )
          replace_once(
              'src/engine/game.ts',
              """    homeStarter =
              homeStarters[homeStarterIndex % Math.max(1, homeStarters.length)] || homeTeam.pitchers[0],
            awayStarter =
              awayStarters[awayStarterIndex % Math.max(1, awayStarters.length)] || awayTeam.pitchers[0];
          """,
              """    homeStarter =
              homeStarters[homeStarterIndex % Math.max(1, homeStarters.length)] ||
              homeTeam.pitchers.find((player) => (player.injuryDays ?? 0) <= 0) ||
              homeTeam.pitchers[0],
            awayStarter =
              awayStarters[awayStarterIndex % Math.max(1, awayStarters.length)] ||
              awayTeam.pitchers.find((player) => (player.injuryDays ?? 0) <= 0) ||
              awayTeam.pitchers[0];
          """,
          )
          replace_once(
              'src/engine/game.ts',
              """    starterH: homeStarter as Player,
              starterA: awayStarter as Player,
            };
          """,
              """    starterH: homeStarter as Player,
              starterA: awayStarter as Player,
              postGameEvents: { awakenings: [], injuries: [] },
            };
          """,
          )
          replace_once(
              'src/engine/game.ts',
              """  gameState.loserPitcherId = Object.entries(losingRuns).sort((a, b) => b[1] - a[1])[0]?.[0] || null;
            return gameState;
          """,
              """  gameState.loserPitcherId = Object.entries(losingRuns).sort((a, b) => b[1] - a[1])[0]?.[0] || null;
            const participantIds = (side: Side): Set<string> => {
                const teamKey = gameState.teams[side].key,
                  ids = new Set<string>();
                for (const entry of gameState.atBatLog) {
                  if (entry.bSide === teamKey) ids.add(entry.batterId);
                  if (entry.pSide === teamKey) ids.add(entry.pitcherId);
                }
                return ids;
              },
              homePostGame = applyPostGamePlayerEvents(homeTeam, participantIds('home')),
              awayPostGame = applyPostGamePlayerEvents(awayTeam, participantIds('away'));
            gameState.teams = { home: homePostGame.team, away: awayPostGame.team };
            gameState.postGameEvents = {
              awakenings: [
                ...homePostGame.events.awakenings,
                ...awayPostGame.events.awakenings,
              ],
              injuries: [...homePostGame.events.injuries, ...awayPostGame.events.injuries],
            };
            // Deliberately persist post-game roster state for every caller, including CPU skips and diagnostics.
            teams[homeKey] = homePostGame.team;
            teams[awayKey] = awayPostGame.team;
            return gameState;
          """,
          )

          test_path = Path('tests/engine.unit.test.ts')
          test_text = test_path.read_text()
          test_text = test_text.replace(
              """  calcStandings,
            configureRandom,
          """,
              """  bestLineup,
            calcStandings,
            configureRandom,
            growPlayer,
          """,
              1,
          )
          marker = "test('calcStandings records wins, losses, runs and ranks', () => {"
          tests = """test('growPlayer records a non-zero change even when deterministic growth rounds to zero', () => {
            const player = makePlayer('flat-growth', false);
            player.age = 31;
            player.pot = { ...player.p };
            configureRandom(() => 0.5, () => Date.UTC(2026, 0, 1));
            try {
              const grown = growPlayer(player),
                latest = grown.growthLog?.at(-1);
              assert.ok(latest?.changes?.length);
              assert.ok(latest.changes.some((change) => change.diff !== 0));
            } finally {
              resetRandom();
            }
          });

          test('post-game processing can awaken a participant and award a special ability', () => {
            const teams = initTeams(),
              target = teams.giants.fielders[0] as Player;
            target.age = 20;
            target.p = { ...target.p, cf: 25, cb: 25, pw: 25, dc: 25, sp: 25, df: 25, arm: 25 };
            target.pot = { cf: 70, cb: 70, pw: 70, dc: 70, sp: 70, df: 70, arm: 70, stam: 70 };
            target.specials = [];
            target.specialLevels = {};
            target.awakeCount = 0;
            target.seasonAwakenDone = false;
            configureRandom(() => 0, () => Date.UTC(2026, 0, 1));
            try {
              const result = simulateGame('giants', 'tigers', teams),
                updated = teams.giants.fielders.find((player) => player.id === target.id);
              assert.ok(result.postGameEvents.awakenings.some((event) => event.playerId === target.id));
              assert.equal(updated?.seasonAwakenDone, true);
              assert.ok((updated?.specials?.length ?? 0) > 0);
            } finally {
              resetRandom();
            }
          });

          test('post-game injuries set severity and keep injured players out of the next lineup', () => {
            const teams = initTeams(),
              target = teams.giants.fielders[0] as Player;
            target.seasonAwakenDone = true;
            configureRandom(() => 0, () => Date.UTC(2026, 0, 1));
            try {
              const result = simulateGame('giants', 'tigers', teams),
                updated = teams.giants.fielders.find((player) => player.id === target.id);
              assert.ok(result.postGameEvents.injuries.some((event) => event.playerId === target.id));
              assert.equal(updated?.injurySeverity, 'light');
              assert.ok((updated?.injuryDays ?? 0) > 0);
              assert.ok(!bestLineup(teams.giants).some((player) => player.id === target.id));
            } finally {
              resetRandom();
            }
          });

          """ + marker
          if "growPlayer records a non-zero change" not in test_text:
              test_text = test_text.replace(marker, tests, 1)
          test_path.write_text(test_text)
          PY
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Implementation already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Enable in-season awakenings and injuries"
          git push
