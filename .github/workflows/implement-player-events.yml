name: Implement Player Events

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply implementation patch
        run: python scripts/apply-player-events-patch.py
      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Implementation already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Enable in-season awakenings and injuries"
          git push
