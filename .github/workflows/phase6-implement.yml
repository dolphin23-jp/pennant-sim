name: Phase 6 implement

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'agent/phase6-fictional-history-v2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase6-fictional-history-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/phase6-implement.py
      - name: Commit implementation
        run: |
          rm -f scripts/phase6-implement.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: generate fictional league history at new game"
          git push origin HEAD:agent/phase6-fictional-history-v2
      - run: npm run lint
      - run: npm test
      - run: npm run build
