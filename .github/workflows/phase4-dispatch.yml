name: Phase 4 dispatch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'agent/phase4-career-ledger' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase4-career-ledger
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/phase4-implement.py
      - name: Commit implementation
        run: |
          rm -f scripts/phase4-implement.py .github/workflows/phase4-implement.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add yearly player career ledger"
          git push origin HEAD:agent/phase4-career-ledger
