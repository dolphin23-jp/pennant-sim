name: Phase 5 lint diagnostics

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/phase5-historical-rankings-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture lint output
        shell: bash
        run: |
          set +e
          npm run lint > phase5-lint.log 2>&1
          echo "$?" > phase5-lint-exit.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase5-lint-diagnostics
          path: |
            phase5-lint.log
            phase5-lint-exit.txt
