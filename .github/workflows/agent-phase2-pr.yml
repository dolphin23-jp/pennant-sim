name: Temporary phase 2 balance validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'agent/balance-phase2' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply phase 2
        id: patch
        run: |
          mkdir -p baseline
          set +e
          {
            node scripts/agent-phase2.mjs
            node scripts/agent-phase2-tune.mjs
            node scripts/agent-phase2-floor.mjs
          } > baseline/phase2-patch.log 2>&1
          status=$?
          set -e
          cat baseline/phase2-patch.log
          echo "$status" > baseline/phase2-patch.status
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Format
        if: steps.patch.outputs.status == '0'
        run: npx prettier --write src/engine/players.ts src/engine/market.ts scripts/balance-new-engine.ts
      - name: Build
        if: steps.patch.outputs.status == '0'
        continue-on-error: true
        run: npm run build > baseline/phase2-build.log 2>&1
      - name: Unit tests
        if: steps.patch.outputs.status == '0'
        continue-on-error: true
        run: npm run test:unit > baseline/phase2-unit.log 2>&1
      - name: Generate 100-season candidate baseline
        if: steps.patch.outputs.status == '0'
        continue-on-error: true
        run: npm run baseline:new > baseline/phase2-baseline.log 2>&1
      - name: Commit source and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/players.ts src/engine/market.ts scripts/balance-new-engine.ts 2>/dev/null || true
          git add -f baseline/new-season-stats.json baseline/phase2-*.log baseline/phase2-*.status 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Validate phase 2 player distribution"
          git push origin HEAD:${{ github.head_ref }}
