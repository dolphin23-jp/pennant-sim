name: Phase 7 implement

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'agent/phase7-ai-roster-strategy' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-ai-roster-strategy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/phase7-implement.py
      - run: python scripts/phase7-fix-lint.py
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit implementation
        run: |
          rm -f scripts/phase7-implement.py scripts/phase7-fix-lint.py scripts/phase7-trigger*.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add auditable diverse AI strategies"
          git push origin HEAD:agent/phase7-ai-roster-strategy
