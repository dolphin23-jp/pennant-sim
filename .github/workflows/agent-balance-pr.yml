name: Temporary balance PR validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    if: >-
      github.head_ref == 'agent/balance-core' ||
      github.head_ref == 'agent/balance-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate balance core
        if: github.head_ref == 'agent/balance-core'
        run: |
          mkdir -p baseline
          set +e
          {
            node scripts/agent-tune-1.mjs
            node scripts/agent-tune-2.mjs
            npx prettier --write src/engine/game.ts src/engine/players.ts src/engine/market.ts scripts/balance-new-engine.ts tests/balance-generation.test.ts
            npm run build
            npm run test:unit
            npm run baseline:new
          } > baseline/agent-test.log 2>&1
          status=$?
          set -e
          echo "$status" > baseline/agent-test.status
      - name: Diagnose phase 1 CI
        if: github.head_ref == 'agent/balance-phase1'
        run: |
          mkdir -p baseline
          set +e
          npm test > baseline/agent-test.log 2>&1
          status=$?
          set -e
          echo "$status" > baseline/agent-test.status
      - name: Commit diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No diagnostics to commit"
            exit 0
          fi
          git commit -m "Capture ${{ github.head_ref }} validation"
          git push origin HEAD:${{ github.head_ref }}
