name: Temporary balance PR validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    if: >-
      github.head_ref == 'agent/balance-core' ||
      startsWith(github.head_ref, 'agent/balance-phase')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply requested balance phase
        id: patch
        run: |
          mkdir -p baseline
          set +e
          if [ "${{ github.head_ref }}" = "agent/balance-core" ]; then
            {
              node scripts/agent-tune-1.mjs
              node scripts/agent-tune-2.mjs
            } > baseline/agent-patch.log 2>&1
          elif [ "${{ github.head_ref }}" = "agent/balance-phase1" ]; then
            node scripts/agent-phase1.mjs > baseline/agent-patch.log 2>&1
          else
            echo "No patch runner configured for ${{ github.head_ref }}" > baseline/agent-patch.log
            exit 2
          fi
          status=$?
          set -e
          cat baseline/agent-patch.log
          echo "$status" > baseline/agent-patch.status
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Format changed files
        if: steps.patch.outputs.status == '0'
        run: |
          candidates=(
            src/engine/game.ts
            src/engine/players.ts
            src/engine/market.ts
            src/engine/types.ts
            src/state/offseason.ts
            src/data/constants.ts
            scripts/balance-new-engine.ts
            scripts/npb-targets.mjs
            tests/balance-generation.test.ts
          )
          existing=()
          for file in "${candidates[@]}"; do
            if [ -f "$file" ]; then existing+=("$file"); fi
          done
          npx prettier --write "${existing[@]}"
      - name: Build
        if: steps.patch.outputs.status == '0'
        continue-on-error: true
        run: npm run build > baseline/agent-build.log 2>&1
      - name: Unit tests
        if: steps.patch.outputs.status == '0'
        continue-on-error: true
        run: npm run test:unit > baseline/agent-unit.log 2>&1
      - name: Generate 100-season baseline
        if: steps.patch.outputs.status == '0'
        continue-on-error: true
        run: |
          if [ "${{ github.head_ref }}" = "agent/balance-phase1" ]; then
            npm run baseline > baseline/agent-baseline.log 2>&1
          else
            npm run baseline:new > baseline/agent-baseline.log 2>&1
          fi
      - name: Commit source and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Validate ${{ github.head_ref }}"
          git push origin HEAD:${{ github.head_ref }}
