name: Temporary balance PR validation

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'agent/balance-core'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply balance tuning
        id: patch
        run: |
          mkdir -p baseline
          set +e
          {
            node scripts/agent-tune-1.mjs
            node scripts/agent-tune-2.mjs
          } > baseline/agent-patch.log 2>&1
          status=$?
          set -e
          cat baseline/agent-patch.log
          echo "$status" > baseline/agent-patch.status
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Format changed files
        if: steps.patch.outputs.status == '0'
        run: >-
          npx prettier --write
          src/engine/game.ts
          src/engine/players.ts
          src/engine/market.ts
          scripts/balance-new-engine.ts
          tests/balance-generation.test.ts
      - name: Build
        if: steps.patch.outputs.status == '0'
        continue-on-error: true
        run: npm run build > baseline/agent-build.log 2>&1
      - name: Unit tests
        if: steps.patch.outputs.status == '0'
        continue-on-error: true
        run: npm run test:unit > baseline/agent-unit.log 2>&1
      - name: Generate 100-season candidate baseline
        if: steps.patch.outputs.status == '0'
        continue-on-error: true
        run: npm run baseline:new > baseline/agent-baseline.log 2>&1
      - name: Commit source and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/engine/game.ts \
            src/engine/players.ts \
            src/engine/market.ts \
            scripts/balance-new-engine.ts \
            tests/balance-generation.test.ts
          git add -f baseline/agent-*.log baseline/agent-patch.status 2>/dev/null || true
          if [ -f baseline/new-season-stats.json ]; then
            git add -f baseline/new-season-stats.json
          fi
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "Validate tuned simulation balance"
          git push origin HEAD:agent/balance-core
