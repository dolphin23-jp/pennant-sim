name: Regenerate Player Event Baselines

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Regenerate recorded baseline
        run: npm run baseline
      - name: Regenerate comparison baseline
        run: npm run baseline:new
      - name: Regenerate franchise drift
        run: npm run drift
      - name: Commit baseline reports
        shell: bash
        run: |
          if git diff --quiet -- baseline/season-stats.json baseline/new-season-stats.json baseline/franchise-drift.json; then
            echo "Baselines already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline/season-stats.json baseline/new-season-stats.json baseline/franchise-drift.json
          git commit -m "Regenerate player event baselines"
          git push
